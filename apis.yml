name: StudySoup
description: >-
  StudySoup is a consumer education-technology platform that provides college and
  university students with study tools for better grades. It offers custom study
  guides written by student notetakers, step-by-step textbook solutions (AnswerED
  videos), video overviews of core curriculum (PreparED), and community features
  including a Discord channel and YouTube livestreams, alongside a notetaker
  monetization program that pays students to share their notes. StudySoup was
  surfaced as a portfolio company of 500 Global and added to the API Evangelist
  network as a lead. As of this enrichment pass the live site (studysoup.com) is an
  active B2C study-resources product with no publicly documented API, developer
  portal, SDKs, or integration surface.
